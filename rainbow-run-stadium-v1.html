<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#d6eef9">
<title>Rainbow Run Stadium</title>
<!-- BLUE PHONE: Rainbow Run stadium mode, the seat phone.
     A seat code opens this page with the room and the seat in its address. The phone joins the room as a
     stadium seat, works out where its seat sits from the layout the host sends, and lights its whole screen
     with its own pixel of the show. Sound flybys play from every seat with the delay and the pitch bend that
     seat would hear from a source moving past, so the sound travels through the crowd.
     BLUE PHONE: a picture cue puts the same picture on every screen, and a video cue plays the same video link on
     every screen, kept in step with the server clock.
     BLUE PHONE: a demo cue runs one of the Rainbow Run animations, and a video stunt runs a video, across the whole
     crowd: each phone runs the same frame on a small hidden screen and shows the color under its own seat.
     BLUE PHONE: while the host plays the timing beacon through the venue speakers, the phone listens for it and sets
     its clock against the room's own sound, after taking off the time the sound took to reach its seat. -->
<style>
:root{--ink:#1f2433;--soft:#5b6478;--line:#c9d3e0;--blue:#2f6fd6;--card:#ffffffee}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#d6eef9;color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#light{position:fixed;inset:0;background:#18202c}
#pic,#vid{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none;pointer-events:none}
#pic.cover,#vid.cover{object-fit:cover}
#yt{position:fixed;inset:0;background:#000;display:none;pointer-events:none;overflow:hidden}
#chip{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));
  background:var(--card);border:2px solid var(--blue);border-radius:12px;padding:6px 10px;font-weight:700;font-size:.85rem;transition:opacity .6s}
#chip.gone{opacity:0}
.over{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:#d6eef9f2}
.over[hidden]{display:none}
.card{width:100%;max-width:380px;background:#fff;border:2px solid var(--blue);border-radius:18px;padding:18px}
h1{margin:0 0 6px;font-size:1.4rem;color:var(--blue)}
p{margin:0 0 12px;color:var(--soft);line-height:1.4}
input{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:0 0 10px;-webkit-user-select:text;user-select:text}
button{font:inherit;font-weight:700;font-size:1rem;border-radius:12px;border:0;padding:14px;width:100%;margin:0 0 8px;background:var(--blue);color:#fff;cursor:pointer}
button.ghost{background:#eef3f9;color:var(--ink);border:1px solid var(--line)}
.big{font-size:2rem;font-weight:800;color:var(--ink);margin:0 0 6px}
</style>
<link rel="manifest" href="rainbow-run-v1.webmanifest">
<link rel="icon" href="rainbow-run-v1-icon-192.png">
<script>/* BLUE PHONE: preload every show file onto the phone */try{if("serviceWorker" in navigator)navigator.serviceWorker.register("rainbow-run-v1-sw.js").catch(function(){})}catch(e){}</script>
</head>
<body>
<div id="light"></div>
<img id="pic" alt="">
<video id="vid" playsinline preload="auto"></video>
<div id="yt"></div>
<div id="chip" class="gone"></div>

<div class="over" id="entry" hidden>
  <div class="card">
    <h1>Rainbow Run Stadium</h1>
    <p>Scan the seat code on your seat with the camera, or type the room and seat printed on it.</p>
    <input id="roomIn" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="room code" aria-label="Room code">
    <input id="seatIn" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="seat, for example A-3-12" aria-label="Seat">
    <button id="entryGo">Take my seat</button>
  </div>
</div>

<div class="over" id="start" hidden>
  <div class="card">
    <h1>You're in seat</h1>
    <div class="big" id="startSeat"></div>
    <p>Turn your brightness and volume up, hold the screen toward the stage, and tap to join the show.</p>
    <p id="preload">Loading the show onto this phone</p>
    <button id="startGo">Join the show</button>
  </div>
</div>

<div class="over" id="info" hidden>
  <div class="card">
    <h1>Seat <span id="infoSeat"></span></h1>
    <p id="infoText"></p>
    <button id="infoBack">Back to the show</button>
    <button class="ghost" id="infoMove">Change seat</button>
  </div>
</div>

<script src="stompbox-lab-v3-config.js"></script>
<script src="rainbow-run-stadium-v1-youtube.js"></script>
<script src="stompbox-lab-v2-clock.js"></script>
<script src="rainbow-run-stadium-v1-core.js"></script>
<script src="rainbow-run-stadium-v1-mosaic.js"></script>
<script src="rainbow-run-stadium-v1-beacon.js"></script>
<script>
(function(){
"use strict";
const APP="rainbow-run";
const SYNC_URL=(window.STOMPBOX_LAB_CONFIG&&window.STOMPBOX_LAB_CONFIG.syncUrl)||"";
const $=id=>document.getElementById(id);
function keep(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null}
const cleanRoom=r=>String(r||"").trim().toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,24);
const cleanSeat=s=>String(s||"").trim().toUpperCase().replace(/\s+/g,"-").replace(/[^A-Z0-9-]/g,"").slice(0,16);

let device=keep(APP+"-device-id");
if(!device){device=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(16)+Math.random().toString(16).slice(2);keep(APP+"-device-id",device)}
const q=new URLSearchParams(location.search);
let room=cleanRoom(q.get("stadium")||q.get("room")||keep(APP+"-stadium-room"));
let seatId=cleanSeat(q.get("seat")||keep(APP+"-stadium-seat"));

let sock=null,live=false,retry=0,retryTimer=null,status="not connected";
let layout=null,me=null,cue=null,loop=null,joined=false,actx=null,wake=null;

const clock=createServerClock({send:m=>send(m),onChange:()=>{}});
/* Server time on this phone: the network clock, minus what the room's sound says this phone is off by. */
let corr=0,heardList=[],delay=null,beacon=null,listening=null,heardAt=0,lastHeardSend=0;
const rawNow=()=>clock.synced?clock.now():Date.now();
function nowS(){return rawNow()-corr}
function onHeard(err){
  heardAt=Date.now();
  if(Date.now()-lastHeardSend>3000){lastHeardSend=Date.now();send({type:"stadium-heard",err:Math.round(err*10)/10})}
  if(delay===null)return;
  heardList.push(err-delay);if(heardList.length>5)heardList.shift();
  const sorted=heardList.slice().sort((a,b)=>a-b),mid=sorted[Math.floor(sorted.length/2)];
  if(Math.abs(mid)<400)corr=corr*0.5+mid*0.5;
}
async function listen(){
  if(listening||!beacon||!beacon.on||!actx||!navigator.mediaDevices)return;
  listening="asking";
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    listening=await STADIUM_BEACON.listener(actx,stream,rawNow,()=>me&&beacon?{x:me.x,y:me.y,sx:beacon.x,sy:beacon.y}:null,onHeard);
  }catch(e){listening="no"}
}
function unlisten(){if(listening&&listening.stop)listening.stop();listening=null;corr=0;heardList=[]}
function send(m){if(sock&&sock.readyState===1){sock.send(JSON.stringify(Object.assign({app:APP},m)));return true}return false}

function connect(){
  clearTimeout(retryTimer);
  if(sock){const o=sock;sock=null;o.close()}
  live=false;
  if(!SYNC_URL||!room)return;
  const s=new WebSocket(SYNC_URL+"?app="+APP+"&room="+encodeURIComponent(room)+"&device="+encodeURIComponent(device)+"&mode=stadium");
  sock=s;status="connecting";
  s.onopen=()=>{if(sock!==s)return;retry=0;live=true;status="in the room";clock.start();send({type:"stadium-seat",seat:seatId})};
  s.onmessage=e=>{if(sock!==s)return;let m;try{m=JSON.parse(e.data)}catch(_){return}if(!m||m.app!==APP)return;onMsg(m)};
  s.onerror=()=>s.close();
  s.onclose=e=>{if(sock!==s)return;sock=null;live=false;clock.stop();
    status=e.reason==="room full"?"the room is full":"reconnecting";
    retryTimer=setTimeout(connect,Math.min(15000,500*Math.pow(2,retry++))+Math.random()*1500)};
}
function onMsg(m){
  if(m.type==="pong"){clock.pong(m);return}
  if(m.type==="loop"){loop=m.state||null;return}
  if(m.type==="stadium-layout"){layout=m.layout||null;me=layout?STADIUM.place(layout,seatId):null;return}
  if(m.type==="stadium-cue"){cue=m.cue||null;return}
  if(m.type==="stadium-sound"){playFlyby(m.sound);return}
  if(m.type==="stadium-beacon"){beacon=m.beacon||null;if(beacon&&beacon.on){if(joined)listen()}else unlisten();return}
  if(m.type==="stadium-delay"){delay=typeof m.delay==="number"?m.delay:null;return}
}

/* ---------- picture and video on the whole screen ---------- */
const pic=$("pic"),vid=$("vid");let picAt=0,vidKey="",lastSync=0;
function media(now){
  /* BLUE PHONE: a YouTube cue plays YouTube's own player full screen, only once the phone has joined the show */
  STADIUM_YT.sync($("yt"),joined?cue:null,now);
  const src=STADIUM_MOSAIC.current(),stuntOk=!!(c0()&&c0().stunt&&!(src&&src.tainted));
  const c=cue,isPic=!!(c&&c.type==="image"&&now>=c.at),isVid=!!(c&&c.type==="video"&&!stuntOk&&now>=c.at-1500);
  if(isPic){if(picAt!==c.at){picAt=c.at;pic.src=c.src}pic.classList.toggle("cover",c.fit==="cover");pic.style.display="block"}
  else if(pic.style.display!=="none"){pic.style.display="none"}
  if(isVid){
    const key=c.at+"|"+c.url;
    if(vidKey!==key){vidKey=key;vid.src=c.url;vid.loop=!!c.loop;vid.muted=!!c.muted;try{vid.load()}catch(e){}}
    vid.classList.toggle("cover",c.fit==="cover");
    const want=(now-c.at)/1000;
    if(want>=0){
      vid.style.display="block";
      if(vid.readyState>=1&&isFinite(vid.duration)){
        let tgt=want;if(c.loop)tgt=want%vid.duration;
        if(!c.loop&&want>vid.duration){vid.pause();return}
        if(vid.paused){vid.currentTime=tgt;vid.play().catch(()=>{vid.muted=true;vid.play().catch(()=>{})})}
        if(now-lastSync>1000){lastSync=now;const d=tgt-vid.currentTime;
          if(Math.abs(d)>0.35)vid.currentTime=tgt;else vid.playbackRate=Math.max(0.95,Math.min(1.05,1+d*0.5))}
      }
    }
  } else if(vidKey){vidKey="";vid.pause();vid.removeAttribute("src");try{vid.load()}catch(e){}vid.style.display="none"}
}

function c0(){return cue&&cue.type==="video"?cue:null}
/* The page the hidden animation runs in reads the shared clock and band loop from here. */
window.__stadiumNow=()=>nowS();
window.__stadiumLoop=()=>loop;
let mosaicCol=null;
function mosaicColor(now){
  if(!me||!STADIUM_MOSAIC.wants(cue)){STADIUM_MOSAIC.make(null);return null}
  const bx=cue.box,b=me.b,aspect=bx?(bx.x1-bx.x0)/Math.max(1,bx.y1-bx.y0):b.w/b.h;
  const src=STADIUM_MOSAIC.make(cue,aspect,window.__stadiumNow);
  if(!src||src.tainted||now<cue.at)return mosaicCol;
  const u=bx?(me.x-bx.x0)/Math.max(1,bx.x1-bx.x0):me.u,v=bx?(me.y-bx.y0)/Math.max(1,bx.y1-bx.y0):me.v;
  const col=STADIUM_MOSAIC.sample(src.grab(),u,v);
  if(col)mosaicCol=col;return mosaicCol;
}

/* ---------- light ---------- */
const light=$("light");let lastCol="";
function frame(){
  requestAnimationFrame(frame);
  if(!joined)return;
  media(nowS());
  let col=[24,32,44];
  if(me&&cue){const now=nowS(),t=(now-cue.at)/1000;
    const mc=STADIUM_MOSAIC.wants(cue)?mosaicColor(now):null;
    col=mc||(t<0?[24,32,44]:STADIUM.color(cue,me,t,STADIUM.beatCount(loop,cue,now)))}
  else{STADIUM_MOSAIC.make(null);if(!me&&layout)col=[90,96,110]}
  const css="rgb("+col[0]+","+col[1]+","+col[2]+")";
  if(css!==lastCol){lastCol=css;light.style.background=css}
}

/* ---------- sound ---------- */
let noiseBuf=null;
function playFlyby(snd){
  if(!actx||!me||!snd||!(snd.dur>0))return;
  const fb=STADIUM.flyby(snd,me,0.02);
  const now=nowS();
  let start=actx.currentTime+(snd.at-now)/1000,skip=0;
  if(start<actx.currentTime+0.05){skip=Math.ceil((actx.currentTime+0.05-start)/fb.step);start+=skip*fb.step}
  const F=fb.freq.subarray(skip),G=fb.gain.subarray(skip);
  if(F.length<4)return;
  const len=(F.length-1)*fb.step;
  const osc=actx.createOscillator(),amp=actx.createGain(),out=actx.createGain();
  osc.type=snd.tone==="engine"?"sawtooth":snd.tone==="siren"?"square":"sine";
  amp.gain.value=0;out.gain.value=snd.tone==="tone"?0.9:0.35;
  let last=osc;
  if(snd.tone==="engine"){const f=actx.createBiquadFilter();f.type="lowpass";f.frequency.value=900;f.Q.value=2;osc.connect(f);last=f}
  last.connect(amp);amp.connect(out);out.connect(actx.destination);
  try{
    osc.frequency.setValueCurveAtTime(F,start,len);
    amp.gain.setValueCurveAtTime(G,start,len);
  }catch(e){return}
  osc.start(start);osc.stop(start+len+0.05);
}

/* ---------- screens ---------- */
const chip=$("chip");let chipTimer=null;
function showChip(text){chip.textContent=text;chip.classList.remove("gone");clearTimeout(chipTimer);chipTimer=setTimeout(()=>chip.classList.add("gone"),4000)}
function stateText(){
  if(!live)return status;
  if(!layout)return "In the room, waiting for the host to set the seats.";
  if(!me)return "Seat "+seatId+" is not in the "+(layout.name||"current")+" layout. Check the seat code, or ask the host.";
  let t=cue?"In the room, the show is running.":"In the room. The show starts when the host starts it.";
  if(listening==="no")t+=" The microphone is off, so timing comes from the network.";
  else if(listening&&Date.now()-heardAt<12000)t+=" Timing is locked to the room's sound, "+Math.round(corr)+" ms off the network clock.";
  else if(listening)t+=" Listening for the timing beacon.";
  return t;
}
function begin(){
  $("entry").hidden=true;$("startSeat").textContent=seatId;$("start").hidden=false;
  keep(APP+"-stadium-room",room);keep(APP+"-stadium-seat",seatId);
  connect();
}
$("roomIn").value=room;$("seatIn").value=seatId;
$("entryGo").addEventListener("click",()=>{
  const r=cleanRoom($("roomIn").value),s=cleanSeat($("seatIn").value);
  if(!r){$("roomIn").focus();return}if(!s){$("seatIn").focus();return}
  room=r;seatId=s;begin();
});
$("startGo").addEventListener("click",async()=>{
  const AC=window.AudioContext||window.webkitAudioContext;
  try{if(!actx)actx=new AC();await actx.resume()}catch(e){}
  try{wake=await navigator.wakeLock.request("screen")}catch(e){}
  try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(e){}
  $("start").hidden=true;joined=true;showChip("Seat "+seatId);listen();
});
document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState==="visible"&&joined){try{wake=await navigator.wakeLock.request("screen")}catch(e){}try{actx&&actx.resume()}catch(e){}}
});
light.addEventListener("click",()=>{if(!joined)return;$("infoSeat").textContent=seatId;$("infoText").textContent=stateText();$("info").hidden=false});
$("infoBack").addEventListener("click",()=>{$("info").hidden=true});
$("infoMove").addEventListener("click",()=>{$("info").hidden=true;joined=false;$("entry").hidden=false});
setInterval(()=>{if(!$("info").hidden)$("infoText").textContent=stateText()},1000);

/* BLUE PHONE: how much of the show is already saved on this phone. */
async function preloadState(){
  try{
    const list=(await (await fetch("rainbow-run-v1-assets.json")).json()).files||[];
    const keys=await caches.keys();let have=0;
    for(const k of keys){const c=await caches.open(k);for(const f of list)if(await c.match(f))have++;break}
    const done=have>=list.length&&list.length>0;
    $("preload").textContent=done?"The whole show is saved on this phone.":"Saving the show onto this phone, "+Math.round(100*have/Math.max(1,list.length))+" percent";
    if(!done)setTimeout(preloadState,1500);
  }catch(e){$("preload").textContent=""}
}
preloadState();
if(room&&seatId)begin();else $("entry").hidden=false;
frame();
window.RRStadium={get corr(){return corr},get me(){return me},get cue(){return cue},get layout(){return layout},clock:clock,get live(){return live}};
})();
</script>
</body>
</html>
